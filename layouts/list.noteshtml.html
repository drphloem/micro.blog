{{ define "main" }}
{{- $s := partial "split_posts.html" . -}}
<header class="page-head">
    <h1>Notes</h1>
    {{- with .Site.Params.notes_intro }}<p class="page-intro">{{ . }}</p>{{ end }}
</header>

{{ range $s.notes.GroupByDate "2006" }}
<h2 class="year">{{ .Key }}</h2>
<ul class="notes h-feed">
    {{- range .Pages }}{{ partial "note_row.html" . }}{{ end }}
</ul>
{{ end }}
{{ end }}
