<style>
/* ------------------------------------------------------------------
   Tokens. The palette is borrowed from the histology bench:
   slide white, safranin red (the accent), fast green, ink.
------------------------------------------------------------------- */
:root {
  --slide: #F5F6F2;
  --ink: #1E2A2D;
  --muted: #586769;
  --rule: #D5D9D1;
  --safranin: #A8243B;
  --fastgreen: #2E6B54;
  --code-bg: #ECEEE8;

  /* petiole diagram: safranin and astra blue */
  --pt-epidermis: #D6E2EE;
  --pt-outline: #1E2A2D;
  --pt-ground: #EEF3F8;
  --pt-pith: #CBD8E6;
  --pt-xylem: #B3203A;
  --pt-phloem: #2563C9;

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --gutter: clamp(1.25rem, 4vw, 2.5rem);
  --measure: 38rem;
}

/* Dark: near-black green ground, fluorescent-green phloem */
@media (prefers-color-scheme: dark) {
  :root {
    --slide: #111716;
    --ink: #E6EBE8;
    --muted: #9AA8A4;
    --rule: #2A3431;
    --safranin: #5BE38A;
    --fastgreen: #5BE38A;
    --code-bg: #1A2220;

    --pt-epidermis: #1F2B28;
    --pt-outline: #4A5C57;
    --pt-ground: #161E1C;
    --pt-pith: #26322F;
    --pt-xylem: #4A5A55;
    --pt-phloem: #39FF7A;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }

body {
  margin: 0;
  background: var(--slide);
  color: var(--ink);
  font-family: var(--serif);
  font-optical-sizing: auto;
  font-size: 1.125rem;
  line-height: 1.6;
  text-rendering: optimizeLegibility;
}

img { max-width: 100%; height: auto; }

.wrap {
  width: 100%;
  max-width: 72rem;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

a {
  color: inherit;
  text-decoration-line: underline;
  text-decoration-color: var(--safranin);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 0.18em;
}
a:hover { color: var(--safranin); }

:focus-visible {
  outline: 3px solid var(--safranin);
  outline-offset: 3px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 0;
}
.skip:focus {
  left: 1rem;
  top: 1rem;
  z-index: 10;
  padding: 0.5rem 0.75rem;
  background: var(--ink);
  color: var(--slide);
}

/* ---------------- Header and footer ---------------- */
.site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem 2rem;
  padding-block: 1.5rem;
}
.site-title {
  font-size: 1.5rem;
  font-weight: 600;
  text-decoration: none;
}
.site-title:hover { color: var(--ink); }

.site-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.5rem;
  font: 500 0.95rem/1.4 var(--sans);
}
.site-nav a {
  color: var(--muted);
  text-decoration: none;
}
.site-nav a:hover { color: var(--ink); }
.site-nav a[aria-current="page"] {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--safranin);
  text-decoration-thickness: 2px;
  text-underline-offset: 0.4em;
}

.site-footer {
  margin-top: 5rem;
  padding-bottom: 3rem;
  color: var(--muted);
  font: 400 0.875rem/1.5 var(--sans);
}
.footer-in {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.5rem 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--rule);
}
.site-footer p { margin: 0; }
.footer-links { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; }

/* ---------------- Home ---------------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 27.5rem);
  align-items: center;
  gap: clamp(2rem, 6vw, 4rem);
  padding-block: clamp(1.5rem, 6vw, 5rem) clamp(2rem, 5vw, 4.5rem);
}
.hero-text h1 {
  max-width: 13em;
  margin: 0 0 1.5rem;
  font-size: clamp(2.2rem, 1.4rem + 2.8vw, 3.5rem);
  font-weight: 500;
  line-height: 1.08;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.hero-text .intro {
  max-width: 34rem;
  margin: 0;
  font-size: 1.25rem;
}
.hero-text .intro-note {
  margin: 1.5rem 0 0;
  color: var(--muted);
  font: 400 0.95rem/1.5 var(--sans);
}

.plate {
  justify-self: center;
  width: 100%;
  margin: 0;
}
.plate-field {
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
}
.petiole { display: block; width: 100%; height: 100%; }
.pt-epidermis { fill: var(--pt-epidermis); stroke: var(--pt-outline); }
.pt-ground { fill: var(--pt-ground); }
.pt-pith { stroke: var(--pt-pith); }
.pt-xylem { fill: var(--pt-xylem); }
.pt-phloem { fill: var(--pt-phloem); }

.plate figcaption {
  margin-top: 1rem;
  color: var(--muted);
  font: 400 0.875rem/1.5 var(--sans);
}
.cap-phloem { color: var(--pt-phloem); font-weight: 600; }
.cap-xylem { color: var(--pt-xylem); font-weight: 600; }
.cap-dark { display: none; }
@media (prefers-color-scheme: dark) {
  .cap-xylem { color: var(--ink); }
  .cap-light { display: none; }
  .cap-dark { display: inline; }
}

/* ---------------- Sections ---------------- */
.section {
  padding-block: 3rem 3.5rem;
  border-top: 1px solid var(--rule);
}
.section-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  margin-bottom: 1.75rem;
}
.section-head a { font: 500 0.95rem/1.4 var(--sans); }
.section h2 {
  margin: 0;
  font-size: 1.875rem;
  font-weight: 500;
  line-height: 1.25;
}
.section-more {
  margin: 1.75rem 0 0;
  color: var(--muted);
  font: 400 0.95rem/1.5 var(--sans);
}

.highlights {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 18.75rem), 1fr));
  gap: 2.5rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.highlights a {
  font-size: 1.375rem;
  font-weight: 500;
  line-height: 1.3;
}
.highlights p {
  margin: 0.5rem 0 0;
  color: var(--muted);
  font-size: 1.0625rem;
  line-height: 1.5;
}

.pubs {
  margin: 0;
  padding: 0;
  list-style: none;
}
.pubs li {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.375rem 2rem;
  padding-block: 1.25rem;
  border-bottom: 1px solid var(--rule);
}
.pubs li > div { flex: 1 1 30rem; min-width: 0; }
.pub-year {
  flex: 0 0 4rem;
  color: var(--muted);
  font: 600 0.875rem/1.4 var(--sans);
  font-variant-numeric: tabular-nums;
}
.pub-title { display: block; font-size: 1.25rem; line-height: 1.35; }
.pubs a.pub-title { display: inline; }
.pub-cite {
  margin: 0.25rem 0 0;
  color: var(--muted);
  font: 400 0.875rem/1.5 var(--sans);
}
.pub-cite b { color: var(--ink); font-weight: 600; }

/* ---------------- Lists of posts ---------------- */
.entries {
  max-width: 44rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.entry {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.25rem;
  padding-block: 1rem;
}
.entry + .entry { border-top: 1px solid var(--rule); }
.entry-meta {
  margin: 0 0 0.2rem;
  color: var(--muted);
  font: 500 0.8rem/1.4 var(--sans);
}
.entry-meta a { color: inherit; text-decoration: none; }
.entry-cat { margin-left: 0.6rem; color: var(--fastgreen); }
.entry-title, .entry-summary {
  margin: 0;
  font-size: 1.1rem;
  line-height: 1.4;
}
.entry-title a, .entry-summary a { text-decoration: none; }
.entry-title a:hover, .entry-summary a:hover { text-decoration: underline; }
.entry-title { font-weight: 500; }
.entry-thumb { flex: none; }
.entry-thumb img {
  display: block;
  width: 3.75rem;
  height: 3.75rem;
  border-radius: 50%;
  object-fit: cover;
}

.notes {
  max-width: 48rem;
  margin: 0;
  padding: 0;
  list-style: none;
}
.note {
  display: grid;
  grid-template-columns: 7rem minmax(0, 1fr);
  gap: 1rem;
  padding-block: 0.45rem;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.5;
}
.note-date {
  padding-top: 0.15rem;
  color: var(--muted);
  font: 500 0.8rem/1.6 var(--sans);
  font-variant-numeric: tabular-nums;
  text-decoration: none;
}
.note-text strong { color: var(--ink); font-weight: 500; }
@media (max-width: 36rem) {
  .note { grid-template-columns: 1fr; gap: 0; }
}

.year { margin: 2.25rem 0 0.25rem; font-size: 1.25rem; font-weight: 500; }

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
  gap: 1.5rem;
  margin: 0;
  padding: 0.75rem 0 0;
  list-style: none;
}
.photo-grid img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  object-fit: cover;
}
.photo-grid a:hover img { outline: 3px solid var(--safranin); outline-offset: 3px; }

.pager {
  display: flex;
  justify-content: space-between;
  margin-top: 2rem;
  font: 500 0.95rem/1.4 var(--sans);
}

/* ---------------- Pages and single posts ---------------- */
.page-head { padding-block: 1rem 1.5rem; }
.page-head h1 {
  max-width: 20em;
  margin: 0;
  font-size: clamp(2rem, 1.4rem + 2vw, 2.9rem);
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -0.012em;
  text-wrap: balance;
}
.page-intro {
  max-width: var(--measure);
  margin: 0.75rem 0 0;
  color: var(--muted);
}
.post-meta {
  margin: 0 0 0.75rem;
  color: var(--muted);
  font: 500 0.85rem/1.4 var(--sans);
}
.post-meta a { color: inherit; text-decoration: none; }
.post-meta .entry-cat { color: var(--fastgreen); }

.prose { max-width: var(--measure); }
.prose > :first-child { margin-top: 0; }
.prose p, .prose ul, .prose ol { margin: 0 0 1.1em; }
.prose h2 { margin: 2em 0 0.5em; font-size: 1.5rem; font-weight: 500; line-height: 1.25; }
.prose h3 { margin: 1.75em 0 0.4em; font-size: 1.25rem; font-weight: 500; line-height: 1.3; }
.prose img { display: block; margin: 1.5rem 0; }
.prose figure { margin: 1.5rem 0; }
.prose blockquote {
  margin: 0 0 1.1em;
  padding-left: 1rem;
  border-left: 2px solid var(--rule);
  color: var(--muted);
}
.prose pre {
  overflow-x: auto;
  padding: 1rem;
  background: var(--code-bg);
  font-size: 0.9rem;
}
.prose hr { margin: 2.5rem 0; border: 0; border-top: 1px solid var(--rule); }

/* ---------------- Small screens ---------------- */
@media (max-width: 52rem) {
  .hero { grid-template-columns: 1fr; }
  .plate { max-width: 26rem; }
}
</style>
