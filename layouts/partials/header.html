<a class="skip" href="#main">Skip to content</a>
<header class="site-header wrap">
    <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
    <div class="header-end">
        <nav class="site-nav" aria-label="Main">
            {{- $here := .RelPermalink -}}
            {{- range .Site.Params.nav -}}
                <a href="{{ .url | relURL }}"{{ if or (eq $here .url) (and (ne .url "/") (hasPrefix $here .url)) }} aria-current="page"{{ end }}>{{ .title }}</a>
            {{- end -}}
        </nav>
        <button class="theme-toggle" type="button" hidden aria-label="Switch color theme">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
    <script>
    (function () {
        var b = document.querySelector(".theme-toggle"), root = document.documentElement;
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function now() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
        function label() { b.setAttribute("aria-label", now() === "dark" ? "Switch to light theme" : "Switch to dark theme"); }
        b.hidden = false;
        label();
        b.addEventListener("click", function () {
            var next = now() === "dark" ? "light" : "dark";
            root.dataset.theme = next;
            try { localStorage.setItem("theme", next); } catch (e) {}
            label();
        });
        if (mq.addEventListener) mq.addEventListener("change", label);
    })();
    </script>
</header>
